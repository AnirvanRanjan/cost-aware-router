# Data sources for Track A. Read by scripts/01_acquire_routerbench.py.
routerbench:
  file: artifacts/raw/routerbench/routerbench_0shot.pkl
  # GSM8K train answers, needed to re-grade GSM8K (RouterBench's own GSM8K scores aren't correctness).
  # Download in a browser and save here:
  # https://huggingface.co/datasets/openai/gsm8k/resolve/main/main/train-00000-of-00001.parquet
  gsm8k_train: artifacts/raw/gsm8k/train-00000-of-00001.parquet
  large: gpt-4-1106-preview
  # Small-model arms (DECISIONS.md D-05): Mixtral-8x7B is the main pair, the one RouteLLM used;
  # Yi-34B is the second, with smaller gaps, for the headroom comparison. Mistral-7B is dropped:
  # it answers "A" to almost every multiple-choice question (notes/routerbench_audit.md).
  small: [mistralai/mixtral-8x7b-chat, zero-one-ai/Yi-34B-Chat]
