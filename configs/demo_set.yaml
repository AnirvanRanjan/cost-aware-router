# T45 demo set, v2 (2026-11-16, D-15). Checked with `python scripts/check_demo_set.py` against the
# bundle the demo will use (`python scripts/11_build_bundle.py --mode cascade_t61 --samples 3`).
#
# easy / hard come from the Track B TEST split, so the router is certified on exactly this kind of
# question: easy = Qwen was right and the certified router kept it local; hard = Qwen was wrong,
# GPT-4 right, and the router escalated. `qid` and `note` say where each came from. The Mac samples
# its own answers, so a few decisions can differ live: swap out any that do, using the check's output.
# Scores are from the release model (cascade_predictions.parquet), which the M1 bundle reproduces
# (tau* 8.219). Run 3 (2026-11-16): 24/26; easy-05 (emus, 1/3 agree live) and easy-07 (3 + p = 15,
# short multiple choice, score 20.7) replaced. Run 4: both replacements failed too (the M1's answers
# disagreed where the H100's agreed), so they are dropped; spares in configs/demo_candidates.yaml
# must be checked on the demo machine before they are added.
# free = question types the router was NOT certified on (labelled so on the page); chat = open-ended.
queries:

  # ---- 9 easy: Qwen right, kept on the Mac (6 arithmetic, 3 multiple choice) ----
  - {id: easy-01, expect: local, qid: grade-school-math.dev.6670,
     query: "Three blue chips are in a jar which is 10% of the entire chips. If 50% of the chips are white and the rest are green, how many green chips are there?",
     note: "Spare (M2, sklearn 1.8.0, tau* 8.219): Qwen 12, 3/3 agree, kept local. Replaces grade-school-math.dev.692 (escalated on M2)."}
  - {id: easy-02, expect: local, qid: grade-school-math.dev.2760,
     query: "Joel is 5 years old and his dad is 32 years old. How old will Joel be when his dad is twice as old as him?",
     note: "Track B: Qwen 27, 3/3 agree (right), gold 27, GPT-4 right; score -22.3 vs tau* 8.22"}
  - {id: easy-03, expect: local, qid: grade-school-math.dev.4688,
     query: "Emily bought a shirt and a coat for $600. What does the shirt cost if it is one-third the price of the coat?",
     note: "Track B: Qwen 150, 3/3 agree (right), gold 150, GPT-4 right; score -11.4 vs tau* 8.22"}
  - {id: easy-04, expect: local, qid: grade-school-math.dev.2825,
     query: "A man owned 1/2 of a lot. He sold 1/10 of his share for the amount of $460. What is the worth of the entire lot?",
     note: "Track B: Qwen 9200, 3/3 agree (right), gold 9200, GPT-4 right; score -9.5 vs tau* 8.22"}
  - {id: easy-06, expect: local, qid: grade-school-math.dev.7189,
     query: "There are 11 boys and 13 girls in a class. If 1 boy is added to the class, what percentage of the class are girls?",
     note: "Track B: Qwen 52, 3/3 agree (right), gold 52, GPT-4 right; score -9.5 vs tau* 8.22"}
  - {id: easy-08, expect: local, qid: mmlu-miscellaneous.val.346,
     query: "The term \"Cold War\" refers to the A) competition between the Soviet Union and China for the resources of the Pacific Rim B) struggle between the United States and the Soviet Union to gain political hegemony in world affairs C) race between the United States and the Soviet Union to claim ownership of Antarctica D) contest between the United States and the European Union for economic domination in the West",
     note: "Track B: Qwen B at p 1.00 (right), gold B, GPT-4 right; score 7.3 vs tau* 8.22"}
  - {id: easy-09, expect: local, qid: mmlu-miscellaneous.val.412,
     query: "During President Dwight Eisenhower's administration in the 1950s, the federal government promoted significant changes in transportation in the United States by A) funding the establishment of a national railroad passenger system B) sponsoring research to develop less polluting automobiles C) funding the construction of the interstate highway system D) establishing generous subsidies for urban mass transit",
     note: "Track B: Qwen C at p 1.00 (right), gold C, GPT-4 right; score 7.3 vs tau* 8.22"}
  - {id: easy-10, expect: local, qid: mmlu-us-foreign-policy.val.92,
     query: "What was the 'Domino Theory'? A) The idea that the growth of democracy in one state would inexorably lead to its growth in others B) The idea that the Cold War operated according to the principles of game theory C) The idea that certain states were of higher value than others to the US during the Cold War D) The idea that the fall of one state to communism would inexorably lead to the fall of its neighbors",
     note: "Track B: Qwen D at p 1.00 (right), gold D, GPT-4 right; score 7.3 vs tau* 8.22"}
  - {id: easy-11, expect: local, qid: grade-school-math.dev.3598,
     query: "Emma bought 3 dozens of macarons in addition to her 10 pieces of macarons for a party. If 15 pieces of macarons are left over, how many pieces of macarons were eaten?",
     note: "Spare (M2, sklearn 1.8.0, tau* 8.219): Qwen 31, 3/3 agree, kept local. Replaces hard-01 (grade-school-math.dev.644): Qwen now solves it on the M2, 3/3 agree, so it is no longer a hard example."}

  # ---- 8 hard: sent to the frontier because Qwen is unsure (answers disagree or low option
  #      probability). On the M2 Qwen is wrong on hard-03 and hard-06..09; on hard-02, 04, 05 it is
  #      right but unsure -- the router errs on the side of quality, which costs money, not accuracy ----
  - {id: hard-02, expect: frontier, qid: grade-school-math.dev.214,
     query: "In 6 months Bella and Bob will be celebrating their 4th anniversary. How many months ago did they celebrate their 2nd anniversary?",
     note: "Track B: Qwen 30, 2/3 agree (wrong), gold 18, GPT-4 right; score 160.8 vs tau* 8.22"}
  - {id: hard-03, expect: frontier, qid: grade-school-math.dev.1884,
     query: "Tom fills a 250 pound sandbag 80% full. But the filling material he is using is 40% heavier than sand. How much does the bag weigh?",
     note: "Track B: Qwen 480, 2/3 agree (wrong), gold 280, GPT-4 right; score 144.6 vs tau* 8.22"}
  - {id: hard-04, expect: frontier, qid: grade-school-math.dev.4921,
     query: "Tyrone empties his piggy bank and finds two $1 bills, a $5 bill, 13 quarters, 20 dimes, 8 nickels, and 35 pennies. How much money does Tyrone have?",
     note: "Track B: Qwen 12, 2/3 agree (wrong), gold 13, GPT-4 right; score 143.1 vs tau* 8.22"}
  - {id: hard-05, expect: frontier, qid: grade-school-math.dev.867,
     query: "Bob runs 6 miles per hour. His friend Jim runs at 9 miles per hour. If Bob has a 1 mile head-start, how many minutes will it take before Jim catches him?",
     note: "Track B: Qwen 3.33, 2/3 agree (wrong), gold 20, GPT-4 right; score 144.4 vs tau* 8.22"}
  - {id: hard-06, expect: frontier, qid: mmlu-miscellaneous.val.587,
     query: "How many periods are there in an ice hockey game? A) Three B) Four C) One D) Two",
     note: "Track B: Qwen D at p 0.67 (wrong), gold A, GPT-4 right; score 134.5 vs tau* 8.22"}
  - {id: hard-07, expect: frontier, qid: mmlu-miscellaneous.val.243,
     query: "What color is cartoon character Marge Simpson's hair? A) blue B) purple C) brown D) yellow",
     note: "Track B: Qwen D at p 0.47 (wrong), gold A, GPT-4 right; score 199.5 vs tau* 8.22"}
  - {id: hard-08, expect: frontier, qid: mmlu-elementary-mathematics.val.27,
     query: "What is the quotient for the expression 2,314 / 4? A) 578 r2 B) 508 C) 508 r2 D) 578",
     note: "Track B: Qwen C at p 0.46 (wrong), gold A, GPT-4 right; score 71.7 vs tau* 8.22"}
  - {id: hard-09, expect: frontier, qid: mmlu-miscellaneous.val.138,
     query: "Which of these is not found in a Snickers candy bar? A) chocolate B) almonds C) nougat D) caramel",
     note: "Track B: Qwen A at p 0.32 (wrong), gold B, GPT-4 right; score 234.3 vs tau* 8.22"}

  # ---- 4 free-form: not a certified question type; the page says so ----
  - {id: free-01, expect: any, query: "What is the capital of Australia?"}
  - {id: free-02, expect: any, query: "Who wrote 'Romeo and Juliet'?"}
  - {id: free-03, expect: any, query: "Translate 'good morning' into French."}
  - {id: free-04, expect: any, query: "Give me a synonym for 'happy'."}

  # ---- 3 open chat: no fixed answer, either route is fine ----
  - {id: chat-01, expect: any, query: "Suggest three names for a study group that works on AI projects."}
  - {id: chat-02, expect: any, query: "Write a two-line poem about a rainy evening in Dehradun."}
  - {id: chat-03, expect: any, query: "Summarise what a model router does in one sentence for someone who is not technical."}
